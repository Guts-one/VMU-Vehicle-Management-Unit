name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-analysis:
    name: Cppcheck and MISRA addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install cppcheck addons (apt package omits them)
        run: |
          set -e
          CPPCHECK_VERSION=$(cppcheck --version | awk '{print $2}')
          echo "Fetching addons matching cppcheck $CPPCHECK_VERSION"
          git clone --depth 1 --branch "$CPPCHECK_VERSION" \
            https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
          sudo mkdir -p /usr/share/cppcheck/addons
          sudo cp /tmp/cppcheck-src/addons/*.py /usr/share/cppcheck/addons/
          ls -la /usr/share/cppcheck/addons/

      - name: Run cppcheck general checks
        run: |
          set +e
          mkdir -p build/static-analysis
          cppcheck --enable=warning,style,performance,portability,unusedFunction \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --inline-suppr \
                   --error-exitcode=1 \
                   --output-file=build/static-analysis/cppcheck-report.txt \
                   -Iinc \
                   src/ inc/
          STATUS=$?
          echo "=== cppcheck general report ==="
          cat build/static-analysis/cppcheck-report.txt
          exit $STATUS

      - name: Run MISRA C 2012 (manual dump + addon)
        run: |
          set -euo pipefail
          cppcheck --dump --inline-suppr -Iinc src/ inc/
          shopt -s nullglob
          dumps=(src/*.dump inc/*.dump)
          if [ "${#dumps[@]}" -eq 0 ]; then
            echo "No cppcheck dumps were generated." >&2
            exit 1
          fi
          : > build/static-analysis/misra-report.txt
          MISRA_STATUS=0
          for f in "${dumps[@]}"; do
            python3 /usr/share/cppcheck/addons/misra.py "$f" \
              >> build/static-analysis/misra-report.txt 2>&1 || MISRA_STATUS=$?
          done
          cat build/static-analysis/misra-report.txt
          exit $MISRA_STATUS

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misra-analysis-report
          path: build/static-analysis/*.txt

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Unity
        run: git clone --depth 1 https://github.com/ThrowTheSwitch/Unity.git unity

      - name: Build and run mode logic tests
        run: npm run test:c

  js-c-equivalence:
    name: JS ↔ C equivalence (web simulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: npm ci

      - name: JS ↔ C differential + MC/DC independence (state + outputs, 0 mismatches)
        run: npm run verify

      - name: JavaScript branch coverage
        run: npm run coverage
